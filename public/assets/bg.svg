<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#4a154b"/>
  <!-- Subtle pattern -->
  <path d="M0,0 L100,100 M100,0 L0,100" stroke="#5d1b5e" stroke-width="4" opacity="0.3" patternUnits="userSpaceOnUse" id="p"/>
  <pattern id="bg-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
    <path d="M50,0 L100,50 L50,100 L0,50 Z" fill="#5d1b5e" opacity="0.2"/>
    <circle cx="50" cy="50" r="10" fill="#5d1b5e" opacity="0.3"/>
  </pattern>
  <rect width="800" height="800" fill="url(#bg-pattern)"/>
</svg>
